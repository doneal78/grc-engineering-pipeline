# grc-gate: run the policy gate on every pull request.
name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -L -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin
          conftest --version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Run policy gate
        id: gate
        run: |
          mkdir -p evidence
          set +e
          conftest test --policy policies --namespace compliance.sc28_aws plan.json --output json > evidence/sc28-results.json
          sc28_exit=$?
          conftest test --policy policies --namespace compliance.ac3_aws plan.json --output json > evidence/ac3-results.json
          ac3_exit=$?
          conftest test --policy policies --namespace compliance.cm6_aws plan.json --output json > evidence/cm6-results.json
          cm6_exit=$?
          jq -s '{sc28: .[0], ac3: .[1], cm6: .[2]}' evidence/sc28-results.json evidence/ac3-results.json evidence/cm6-results.json > evidence/conftest-results.json
          set -e
          if [ $sc28_exit -ne 0 ] || [ $ac3_exit -ne 0 ] || [ $cm6_exit -ne 0 ]; then
            echo "gate_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign evidence bundle
        if: always()
        run: |
          tar czf evidence.tar.gz evidence/
          sha256sum evidence.tar.gz | awk '{print $1}' > evidence.sha256
          cosign sign-blob --yes --bundle evidence.sig.bundle evidence.tar.gz

      - name: Run tamper test
        if: always()
        run: |
          echo "=== Tamper Test: verify real bundle ==="
          bash verify-evidence.sh evidence.tar.gz
          echo
          echo "=== Tamper Test: verify tampered bundle (must FAIL) ==="
          cp evidence.tar.gz /tmp/tampered.tar.gz
          echo "junk" >> /tmp/tampered.tar.gz
          cp evidence.sha256 /tmp/tampered.sha256
          cp evidence.sig.bundle /tmp/tampered.sig.bundle
          if bash verify-evidence.sh /tmp/tampered.tar.gz; then
            echo "ERROR: tampered bundle should have failed verification"
            exit 1
          else
            echo "PASS: tampered bundle correctly rejected"
          fi

      - name: Upload evidence and signatures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-gate-evidence
          path: |
            evidence/
            evidence.tar.gz
            evidence.sha256
            evidence.sig.bundle

      - name: Fail job if any control failed
        if: steps.gate.outputs.gate_failed == 'true'
        run: |
          echo "One or more compliance controls failed. See evidence/conftest-results.json for details."
          exit 1