name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          curl -L -o conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz
          tar xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin
          conftest --version

      - name: Run policy gate
        id: gate
        run: |
          mkdir -p evidence
          set +e
          conftest test --policy policies --namespace compliance.sc28_aws evidence/plan.json --output json > evidence/sc28-results.json
          sc28_exit=$?
          conftest test --policy policies --namespace compliance.ac3_aws evidence/plan.json --output json > evidence/ac3-results.json
          ac3_exit=$?
          conftest test --policy policies --namespace compliance.cm6_aws evidence/plan.json --output json > evidence/cm6-results.json
          cm6_exit=$?
          set -e
          if [ $sc28_exit -ne 0 ] || [ $ac3_exit -ne 0 ] || [ $cm6_exit -ne 0 ]; then
            echo "gate_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-gate-evidence
          path: evidence/

      - name: Fail job if any control failed
        if: steps.gate.outputs.gate_failed == 'true'
        run: |
          echo "One or more compliance controls failed."
          exit 1